name: StashFS
options:
  deploymentTarget:
    macOS: "26.4"
configFiles:
  Debug: config.xcconfig
  Release: config.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  StashCore:
    path: ../core
targets:
  StashFS:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: app
        excludes: ["*.plist", "*.entitlements"]
      - path: shared
    settings:
      base:
        PRODUCT_NAME: Stash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(STASH_BUNDLE_ID)
        INFOPLIST_FILE: app/info.plist
        CODE_SIGN_ENTITLEMENTS: app/stash-fs.entitlements
    dependencies:
      - target: StashFSModule
      - package: StashCore
        product: S3Client
      - package: StashCore
        product: RcloneCrypt
      - package: StashCore
        product: SyncEngine
  StashFSModule:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: extension
        excludes: ["*.plist", "*.entitlements"]
      - path: shared
    settings:
      base:
        PRODUCT_NAME: StashFSModule
        PRODUCT_BUNDLE_IDENTIFIER: $(STASH_BUNDLE_ID).fsmodule
        INFOPLIST_FILE: extension/info.plist
        CODE_SIGN_ENTITLEMENTS: extension/stash-fs-module.entitlements
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - package: StashCore
        product: S3Client
      - package: StashCore
        product: RcloneCrypt
      - package: StashCore
        product: LocalStore
      - package: StashCore
        product: SyncEngine
